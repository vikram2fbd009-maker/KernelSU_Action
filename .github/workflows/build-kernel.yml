name: Build Kernel & AnyKernel3

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 4.14, lineage-20 ]

permissions:
  contents: read

jobs:
  build:
    name: Build camellia Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: arm64
      # ⚠️ YAHAN APNA REPO DAALEIN (Jisme patched code push kiya hai)
      KERNEL_REPO: https://github.com/YOUR_USERNAME/YOUR_KERNEL_REPO
      KERNEL_BRANCH: main 
      KERNEL_DEFCONFIG: camellia_defconfig
      KERNEL_IMAGE: Image.gz-dtb
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz
      GCC64_URL: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
      GCC32_URL: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap space
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"

      - name: Download toolchain
        run: |
          TC="$GITHUB_WORKSPACE/toolchain"
          mkdir -p "$TC/clang" "$TC/gcc64" "$TC/gcc32"
          curl -sSL "$CLANG_URL" | tar -xz -C "$TC/clang" &
          curl -sSL "$GCC64_URL" | tar -xz -C "$TC/gcc64" &
          curl -sSL "$GCC32_URL" | tar -xz -C "$TC/gcc32" &
          wait

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          TC="$GITHUB_WORKSPACE/toolchain"
          export PATH="$TC/clang/bin:$PATH"

          MAKE_ARGS=(
            O=out
            ARCH=$ARCH
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            LD=ld.lld
            CROSS_COMPILE="$TC/gcc64/bin/aarch64-linux-android-"
            CROSS_COMPILE_ARM32="$TC/gcc32/bin/arm-linux-androideabi-"
          )

          make "${MAKE_ARGS[@]}" "$KERNEL_DEFCONFIG"
          make "${MAKE_ARGS[@]}" -j"$(nproc --all)"

      # 🛠️ ANY KERNEL 3 SETUP
      - name: Setup AnyKernel3
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          cd anykernel
          
          # 🔥 DEVICE CHECK BYPASS (Unsupported Device error nahi aayega)
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          
          # Kernel name update karein
          sed -i 's/kernel.string=.*/kernel.string=Overclock Kernel for Camellia/' anykernel.sh
          
          # Image copy karein
          cp ../kernel/out/arch/$ARCH/boot/$KERNEL_IMAGE .

      - name: Create Flashable ZIP
        run: |
          cd "$GITHUB_WORKSPACE/anykernel"
          zip -r9 "$GITHUB_WORKSPACE/AnyKernel3-camellia.zip" * -x ".git/*"

      - name: Upload AnyKernel3 Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-camellia
          path: AnyKernel3-camellia.zip
          if-no-files-found: error
