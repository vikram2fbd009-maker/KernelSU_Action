name: Build Kernel

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build camellia kernel
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      ARCH: arm64
      KERNEL_REPO: https://github.com/dssomvir/android-kernel-xiaomi-camellia
      KERNEL_BRANCH: 4.19.cip
      KERNEL_DEFCONFIG: camellia_defconfig
      KERNEL_IMAGE: Image.gz-dtb
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz
      GCC64_URL: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
      GCC32_URL: https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add swap
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev

      - name: Download toolchain
        run: |
          TC="$GITHUB_WORKSPACE/toolchain"
          mkdir -p "$TC"

          echo "::group::clang"
          mkdir -p "$TC/clang"
          curl -sSL "$CLANG_URL" | tar -xz -C "$TC/clang"
          "$TC/clang/bin/clang" --version
          echo "::endgroup::"

          echo "::group::gcc64"
          mkdir -p "$TC/gcc64"
          curl -sSL "$GCC64_URL" | tar -xz -C "$TC/gcc64"
          echo "::endgroup::"

          echo "::group::gcc32"
          mkdir -p "$TC/gcc32"
          curl -sSL "$GCC32_URL" | tar -xz -C "$TC/gcc32"
          echo "::endgroup::"

      - name: Clone kernel source
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$GITHUB_WORKSPACE/kernel"

      - name: Build kernel
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/kernel"

          TC="$GITHUB_WORKSPACE/toolchain"
          export PATH="$TC/clang/bin:$PATH"

          MAKE_ARGS=(
            O=out
            ARCH=$ARCH
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            LD=ld.lld
            KCFLAGS=-Wno-error=strict-prototypes
            CROSS_COMPILE="$TC/gcc64/bin/aarch64-linux-android-"
            CROSS_COMPILE_ARM32="$TC/gcc32/bin/arm-linux-androideabi-"
          )

          echo "::group::defconfig"
          make "${MAKE_ARGS[@]}" "$KERNEL_DEFCONFIG"
          echo "::endgroup::"

          echo "::group::compile"
          make "${MAKE_ARGS[@]}" -j"$(nproc --all)"
          echo "::endgroup::"

          echo "::group::result"
          ls -la "out/arch/$ARCH/boot/"
          echo "::endgroup::"

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KERNEL_IMAGE }}-camellia
          path: kernel/out/arch/${{ env.ARCH }}/boot/${{ env.KERNEL_IMAGE }}
          if-no-files-found: error

      - name: Upload full boot output (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: kernel-out-boot
          path: kernel/out/arch/${{ env.ARCH }}/boot/
          if-no-files-found: warn
