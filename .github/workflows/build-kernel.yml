name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Config file to build"
        required: false
        default: "config.env"
        type: string
      extra_defconfig:
        description: "Extra defconfig lines"
        required: false
        default: ""
        type: string

concurrency:
  group: build-kernel-${{ github.ref }}-${{ inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      WORKSPACE: ${{ github.workspace }}/kernel_workspace
      CONFIG_ENV: ${{ inputs.config }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      IN_EXTRA_DEFCONFIG: ${{ inputs.extra_defconfig }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        run: bash scripts/config.sh

      # Fast setup (removed unnecessary disk cleanup/swap)
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev
          mkdir -p "$WORKSPACE"

      - name: Set up toolchain
        run: bash scripts/toolchain.sh

      # 1. Fetch Source (Zaroori hai defconfig ke liye)
      - name: Fetch kernel source
        run: bash scripts/source.sh

      # 2. Set KERNEL_DIR (Kyunki hum kernelsu.sh skip kar rahe hain)
      - name: Set KERNEL_DIR
        run: |
          echo "KERNEL_DIR=${{ github.workspace }}/kernel_workspace/android-kernel" >> $GITHUB_ENV

      - name: Set up ccache
        if: env.ENABLE_CCACHE == 'true'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ env.DEVICE }}-${{ env.KERNEL_VERSION }}
          max-size: 2G

      # 3. BUILD STEP (No -k flag, error aate hi ruk jayega)
      - name: Build kernel
        id: build
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build.sh all 2>&1 | tee build_full_log.txt
        continue-on-error: true

      # 4. FAIL-FAST CHECK
      - name: Check build result
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ BUILD FAILED AT FIRST ERROR! Check the 'Build kernel' step above."
          exit 1

      # 5. Package & Upload
      - name: Package artifacts
        if: steps.build.outcome == 'success'
        run: bash scripts/package.sh all

      - name: Upload AnyKernel3
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
          path: kernel_workspace/AnyKernel3/*
          if-no-files-found: error
